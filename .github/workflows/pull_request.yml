name: PR

permissions:
  contents: read

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  soundness:
    name: Soundness
    uses: swiftlang/github-workflows/.github/workflows/soundness.yml@9a10bfdc569159a3463f1273fbd7ed5f97fbe598 # 0.0.15
    with:
      # Files carry the author header, not a license block; the LICENSE file is the license.
      license_header_check_enabled: false
      # Accept the intentional isolation migration while checking all other API changes.
      api_breakage_check_allowlist_path: .github/api-breakage-allowlist.txt
      # Documentation is built without the docc plugin, so the manifest stays dependency-free.
      docs_check_enabled: false

  unit-tests:
    name: Unit tests
    uses: apple/swift-nio/.github/workflows/unit_tests.yml@feaf4ac57e27e411e83e88ee2f9b1789ddf08d0b # main as of 2026-09-26
    with:
      linux_6_3_arguments_override: "-Xswiftc -warnings-as-errors --explicit-target-dependency-import-check error -Xswiftc -require-explicit-sendable"
      linux_nightly_next_arguments_override: "--explicit-target-dependency-import-check error -Xswiftc -require-explicit-sendable"
      linux_nightly_main_arguments_override: "--explicit-target-dependency-import-check error -Xswiftc -require-explicit-sendable"

  static-sdk:
    name: Static Linux Swift SDK
    uses: apple/swift-nio/.github/workflows/static_sdk.yml@feaf4ac57e27e411e83e88ee2f9b1789ddf08d0b # main as of 2026-09-26

  release-builds:
    name: Release builds
    uses: apple/swift-nio/.github/workflows/release_builds.yml@feaf4ac57e27e411e83e88ee2f9b1789ddf08d0b # main as of 2026-09-26

  foundation-linking:
    name: Foundation linking
    uses: vapor/ci/.github/workflows/check-foundation-linking.yml@ad78413e13bebb9158083aa226608e028754106b # main as of 2026-09-23
    with:
      swift_image: swift:6.3-noble
