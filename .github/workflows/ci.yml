name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: CI
    uses: swift-microservices/ci/.github/workflows/library.yml@cbf337bd0589d1dd72a12039eba45959b105d15c  # 1.0.0
    with:
      api_breakage_check_enabled: true
      linux_swift_versions: '["6.3", "6.4", "nightly-main", "nightly-6.4.x"]'
      linux_host_archs: '["x86_64", "aarch64"]'
      enable_linux_static_sdk_build: true
      docs_check_targets: "AuthenticationGRPC"
